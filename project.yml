name: Eikon
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # Only project-level presets: target presets would override the xcconfigs.
  settingPresets: project
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  EikonKit:
    path: Packages/EikonKit
  EikonCore:
    path: Packages/EikonCore
targets:
  Eikon:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
      # build/generated/Acknowledgements.json, passed in by `make project`.
      # A bare `xcodegen generate` fails here on purpose.
      - path: ${EIKON_ACKNOWLEDGEMENTS_JSON}
        buildPhase: resources
    dependencies:
      - package: EikonKit
        product: EikonKit
      - package: EikonCore
        product: EikonCore
    # No preBuildScripts or postBuildScripts: nothing runs in a build phase.
schemes:
  Eikon:
    build:
      targets:
        Eikon: all
    test:
      config: Debug
      targets:
        - package: EikonKit/EikonKitTests
        - package: EikonCore/EikonCoreTests
    run:
      config: Debug
    archive:
      config: Release
